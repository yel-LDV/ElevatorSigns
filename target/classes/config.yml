messages:
  use: '&7&oWhoosh!'
  create: '&bSuccessfully created an elevator!'
  invalid-location: '&cCouldn''t find a suitable location to teleport to!'
  invalid-sign: '&cYour sign wasn''t formatted correctly! Make sure to specify only up or down!'
  no-permission-use: '&cYou don''t have permission to use elevators!'
  no-permission-create: '&cYou don''t have permission to create elevators!'
  lives-remaining: '&eThe elevator takes the hit! &7(&e%lives&7/&e%max &7hits left)'
  lives-broken: '&cThe elevator ran out of lives and broke!'
  lives-cooldown: '&cThis elevator is out of lives! &eIt will work again in %seconds seconds.'
sounds:
  use: 'ANVIL_LAND:0.5:0.5'
  create: 'ANVIL_USE:1.0:2.0'
permissions:
  use: 'elevatorsigns.use'
  create: 'elevatorsigns.create'
  reload: 'elevatorsigns.reload'
floors-enabled: true
max-distance-away: 5.0
elevator-line-format: '&9[Elevator]'
up-keyword: 'Up'
down-keyword: 'Down'
match-updown-lowercase: true
lives:
  # Set this to false and the plugin works exactly like it always has.
  enabled: false
  # How many hits an elevator can take before it breaks. Every hit is one life.
  amount: 3
  # true: the sign breaks and drops on the ground when it runs out of lives.
  # false: the sign stays, but can't be used for 'cooldown-seconds'.
  break-on-empty: true
  cooldown-seconds: 10
  # How long after a hit an elevator waits before it regains one life. Lives
  # start regenerating after the first hit and stop once it's back to full.
  regenerate-seconds: 10